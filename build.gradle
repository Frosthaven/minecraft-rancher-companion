plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'drekki-rancher'
}

// Mojang ships Java 21 to players in 1.21.1.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client { client() }
        // every activity trait in the real game (client/SelfTestTraits, then SelfTestNewTraits), same world
        selfTestTraits {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'selftest'
            jvmArgument '-Drancher_companion.selftest=true'
            jvmArgument '-Drancher_companion.selftest.traits=true'
        }
        // only the enchanted barding part of it
        selfTestEnchants {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'selftest'
            jvmArgument '-Drancher_companion.selftest=true'
            jvmArgument '-Drancher_companion.selftest.new=true'
            jvmArgument '-Drancher_companion.selftest.enchants=true'
        }
        // the real-game test of 0.5.0 (client/SelfTestNewTraits) in the world run/saves/selftest
        selfTestNew {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'selftest'
            jvmArgument '-Drancher_companion.selftest=true'
            jvmArgument '-Drancher_companion.selftest.new=true'
        }
        // barding and bags through the real drekki screen (SelfTestTraits.gear)
        selfTestGear {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'selftest'
            jvmArgument '-Drancher_companion.selftest=true'
            jvmArgument '-Drancher_companion.selftest.gear=true'
        }
        // the 15 roam traits and the Mature stage only (client/SelfTestMature)
        selfTestMature {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'selftest'
            jvmArgument '-Drancher_companion.selftest=true'
            jvmArgument '-Drancher_companion.selftest.new=true'
            jvmArgument '-Drancher_companion.selftest.mature=true'
            // -Prancher_sections=a+b runs only those sections
            if (project.hasProperty('rancher_sections')) jvmArgument "-Drancher_companion.selftest.sections=${project.property('rancher_sections')}"
        }
        server {
            server()
            programArgument '--nogui'
        }
        // the ride on a dedicated server (client/RideTest): the server in run/ridetest-server, then the game that joins it
        rideTestServer {
            server()
            gameDirectory = file('run/ridetest-server')
            jvmArgument '-Drancher_companion.ridetest=true'
            programArgument '--nogui'
        }
        rideTestClient {
            client()
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25577'
            jvmArgument '-Drancher_companion.ridetest=true'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        }
        // The showcase world: straight into the saved world, with the showcase driver on (tools/showcase.py builds it).
        showcase {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'showcase'
            jvmArgument '-Drancher_companion.showcase=true'
        }
        // The block showcase: its own folder (run-blocks), straight into the copied flat world; the player builds every
        // block through the real placement code and the game screenshots it all, then closes (tools/blocks_showcase.py).
        blockShowcase {
            client()
            gameDirectory = project.file('run-blocks')
            programArguments.addAll '--quickPlaySingleplayer', 'blocks'
            jvmArgument '-Drancher_companion.blockshowcase=true'
        }
        // Headless: the dedicated server spawns every group into its world, saves and stops (tools/showcase.py spawn).
        showcaseWorld {
            server()
            programArgument '--nogui'
            jvmArgument '-Drancher_companion.buildworld=true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime': on the dev classpath only, never a published dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url 'https://maven.blamejared.com' }  // JEI's API, for the optional compat/jei plugin
    maven { url 'https://maven.createmod.net' }   // Ponder (Create's), for the optional compat/ponder scenes
    exclusiveContent {                             // Sophisticated Backpacks and Core, for the optional compat/sophisticated bags
        forRepository { maven { url 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {                             // JourneyMap's API, for the optional compat/journeymap death markers
        forRepository { maven { url 'https://jm.gserv.me/repository/maven-public/' } }
        filter { includeGroup 'info.journeymap' }
    }
    exclusiveContent {                             // Jade, for the optional compat/jade tooltip (Modrinth's maven)
        forRepository { maven { url 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // JEI 19.44.0.403, the Haven pack's version: compile only, the plugin loads only when JEI does (compat/jei)
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.44.0.403'
    // Ponder 1.0.82, the one Create 6.0.10 (the Haven pack's) bundles: compile only, used only when Ponder is loaded
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    // Jade 15.10.6+neoforge (the Haven pack's; Modrinth version id eYz2YBGT): compile only, used only when Jade is loaded (compat/jade)
    compileOnly 'maven.modrinth:jade:eYz2YBGT'
    // JourneyMap's API 2.0.0 for 1.21.1 (the API JourneyMap 6.0.2 bundles; it is published only as a snapshot)
    compileOnly 'info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1-SNAPSHOT'
    // Sophisticated Backpacks 3.26.9.2195 and Core 1.5.7.2381 (the Haven pack's; CurseForge file ids 9083940, 9083874):
    // compile only, used only when Sophisticated Backpacks is loaded (compat/sophisticated)
    compileOnly 'curse.maven:sophisticated-backpacks-422301:9083940'
    compileOnly 'curse.maven:sophisticated-core-618298:9083874'
    // Create 6.0.10 (the Haven pack's; CurseForge file id 7963363): compile only, used only when Create is loaded
    // (compat/create: seats for the whistle's Go here, its job hats). Its Flywheel types are reached by method handles
    compileOnly('curse.maven:create-328085:7963363') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.joml:joml:1.10.5'  // the rig's math, for CoplanarTest (Minecraft 1.21.1 ships this JOML)
}

tasks.named('test') {
    useJUnitPlatform()
}

// Expands ${} properties from gradle.properties into neoforge.mods.toml.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
