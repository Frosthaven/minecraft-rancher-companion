modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
A companion animal, the drekki, that grows with the player over three stages.
'''

# the trait effects that no event reaches (mixin/)
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ponder"
    type="optional"
    versionRange="[1.0.82,)"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15,)"
    ordering="NONE"
    side="BOTH"

# JourneyMap (optional): a magenta death marker where one's drekki died (compat/journeymap); its versions read
# "1.21.1-6.0.2", so any version is let in: the plugin needs only its API 2.0, which 6.x bundles
[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# Sophisticated Backpacks (optional): the drekki bags are its backpack items when it is installed (compat/sophisticated);
# it loads first so its item class is ready
[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="optional"
    versionRange="[3.26,)"
    ordering="AFTER"
    side="BOTH"
